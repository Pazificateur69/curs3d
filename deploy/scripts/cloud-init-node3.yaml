#cloud-config
# CURS3D node3 reprovisioning - IONOS VPS 2-2-80, Ubuntu 24.04 / 25.10 / 26.04 x86_64.
# Paste this in IONOS panel "Cloud-Init" / "User Data" field at server creation.
#
# IMPORTANT: this file is ASCII-only on purpose. The 2026-05-12 reinstall
# attempt failed because the previous version had em-dashes and arrow chars,
# which IONOS round-tripped through a broken UTF-16 -> UTF-8 conversion,
# producing a lone surrogate (xdce9) at position 156. cloud-init aborted
# parsing with "Failed loading yaml blob. unacceptable character #xdce9"
# and nothing ran. Keep this file ASCII-only.
#
# History:
#   - 2026-05-06: first reinstall produced "userauth_pubkey: authenticated 0"
#     after "Accepted key" on OpenSSH 10.2p1 (Ubuntu 24.04). Symptom: cloud-init
#     finished cleanly, SSH key was in authorized_keys, perms 700/600, account
#     "ubuntu" looked unlocked, but PAM rejected pubkey at the account stage.
#   - 2026-05-12: belt-and-suspenders against every PAM account-stage
#     rejection we could enumerate (chage aging, /etc/shells coverage,
#     /etc/nologin removal), plus YAML stripped down to ASCII-only.

hostname: curs3d-node3
manage_etc_hosts: true
timezone: Europe/Paris
locale: en_US.UTF-8

# --- packages ---
package_update: true
package_upgrade: false
packages:
  - build-essential
  - pkg-config
  - libssl-dev
  - clang
  - llvm
  - git
  - curl
  - jq
  - ufw
  - fail2ban
  - htop
  - tmux
  - unzip
  - rsync
  - ca-certificates

# --- ssh: key-only, password auth disabled at the daemon level ---
ssh_pwauth: false
disable_root: true

# --- users: ubuntu UNLOCKED so PAM does not reject pubkey login ---
# We intentionally DO NOT set "sudo:" here. Instead we drop a file in
# /etc/sudoers.d/ via write_files below - this avoids a cloud-init quirk
# observed on IONOS images where the inline "sudo:" line silently expands
# into a malformed sudoers line on some Ubuntu releases.
users:
  - default
  - name: ubuntu
    shell: /bin/bash
    groups: [sudo, adm]
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINEHoDbU3Re9HGef/xyX0TtNpu1neczFcmbHw5BFSiA3 alessandro.gagliardi225145@gmail.com

# --- write hardening configs before runcmd ---
write_files:
  - path: /etc/sudoers.d/90-ubuntu-nopasswd
    content: |
      ubuntu ALL=(ALL) NOPASSWD:ALL
    permissions: '0440'

  - path: /etc/fail2ban/jail.d/whitelist.local
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 92.137.37.53
      bantime = 3600
      findtime = 600
      maxretry = 5
    permissions: '0644'

  - path: /etc/ssh/sshd_config.d/99-curs3d.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers ubuntu
      AuthenticationMethods publickey
      MaxAuthTries 5
      LoginGraceTime 30
      UsePAM yes
    permissions: '0644'

  - path: /etc/sysctl.d/99-curs3d.conf
    content: |
      net.core.somaxconn = 4096
      net.ipv4.tcp_max_syn_backlog = 4096
      net.ipv4.tcp_fin_timeout = 30
      vm.swappiness = 10
    permissions: '0644'

# --- post-install commands (run as root, in order) ---
runcmd:
  - [bash, -lc, "passwd -d ubuntu"]
  - [bash, -lc, "usermod -U ubuntu"]
  - [bash, -lc, "usermod -e '' ubuntu"]
  - [bash, -lc, "chage -d -1 -m 0 -M 99999 -E -1 -I -1 ubuntu"]
  - [bash, -lc, "rm -f /etc/nologin /run/nologin /var/run/nologin || true"]
  - [bash, -lc, "grep -qx /bin/bash /etc/shells || echo /bin/bash >> /etc/shells"]
  - [bash, -lc, "install -d -o ubuntu -g ubuntu -m 700 /home/ubuntu/.ssh"]
  - [bash, -lc, "chown -R ubuntu:ubuntu /home/ubuntu/.ssh && chmod 600 /home/ubuntu/.ssh/authorized_keys 2>/dev/null || true"]
  - [bash, -lc, "ufw --force reset"]
  - [bash, -lc, "ufw default deny incoming"]
  - [bash, -lc, "ufw default allow outgoing"]
  - [bash, -lc, "ufw allow 22/tcp"]
  - [bash, -lc, "ufw allow 80/tcp"]
  - [bash, -lc, "ufw allow 443/tcp"]
  - [bash, -lc, "ufw allow 4337/tcp"]
  - [bash, -lc, "ufw allow from 92.137.37.53"]
  - [bash, -lc, "ufw --force enable"]
  - [bash, -lc, "systemctl enable --now fail2ban"]
  - [bash, -lc, "sysctl --system"]
  - [bash, -lc, "if [ ! -f /swapfile ]; then fallocate -l 6G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi"]
  - [bash, -lc, "sshd -t && systemctl restart ssh"]
  - [bash, -lc, "install -d -o ubuntu -g ubuntu /home/ubuntu/curs3d"]
  - [bash, -lc, "install -d -o ubuntu -g ubuntu /home/ubuntu/curs3d-new"]
  - [bash, -lc, "date -u +'cloudinit-ok %FT%TZ' > /etc/curs3d-cloudinit.ok"]

final_message: |
  CURS3D node3 cloud-init done in $UPTIME s.
  Test from your Mac:
    ssh-keygen -R 31.70.70.62
    ssh -o StrictHostKeyChecking=accept-new curs3d-node3 'cat /etc/curs3d-cloudinit.ok'
