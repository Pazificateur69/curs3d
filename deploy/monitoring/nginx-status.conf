# /etc/nginx/sites-available/curs3d-status
# Public Grafana dashboard for the CURS3D testnet at status.curs3d.fr
#
# 1) Run the monitoring stack: cd deploy/monitoring && docker compose up -d
# 2) Symlink and reload nginx:
#    sudo ln -s /etc/nginx/sites-available/curs3d-status /etc/nginx/sites-enabled/
#    sudo certbot --nginx -d status.curs3d.fr
#    sudo systemctl reload nginx

server {
    listen 80;
    server_name status.curs3d.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name status.curs3d.fr;

    ssl_certificate     /etc/letsencrypt/live/status.curs3d.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.curs3d.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public status page (Uptime-Kuma) at /status
    location /status/ {
        proxy_pass         http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Reverse proxy to Grafana running locally on 3001 (anonymous viewer enabled)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Grafana live (websocket)
    location /api/live/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
