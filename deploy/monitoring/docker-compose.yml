version: "3.8"

# CURS3D public monitoring stack — Prometheus + Grafana
# Run on a dedicated host (or one of the validators), exposed via nginx at status.curs3d.fr
#
# Setup:
#   1) Edit prometheus.yml to list the validator node API endpoints (api.curs3d.fr, etc.)
#   2) docker compose up -d
#   3) Set GRAFANA_ADMIN_PASSWORD in env or .env file
#   4) Configure nginx (deploy/monitoring/nginx-status.conf) on status.curs3d.fr -> 127.0.0.1:3001

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: curs3d-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: curs3d-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=https://status.curs3d.fr
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: curs3d-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3002:3001"

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: curs3d-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=127.0.0.1:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - "/:/host:ro,rslave"

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
