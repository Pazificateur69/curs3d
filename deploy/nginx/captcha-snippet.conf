# Snippet to drop into the api.curs3d.fr server block.
# Wires the /api/faucet/request endpoint behind a captcha auth_request.
#
# Prerequisite:
#   - curs3d-captcha.service is running on 127.0.0.1:8090
#   - /etc/curs3d/captcha.env is populated (see curs3d-captcha-verify.py header)
#   - curs3d.service has CURS3D_FAUCET_REQUIRE_CAPTCHA=1 + CURS3D_FAUCET_CAPTCHA_SECRET
#     in /etc/curs3d/secrets.env (matching CAPTCHA_SHARED_SECRET)

# Internal endpoint that nginx calls on every faucet POST.
location = /__captcha_verify {
    internal;
    proxy_pass              http://127.0.0.1:8090/verify;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Captcha-Token  $http_x_captcha_token;
    proxy_set_header        X-Real-IP        $remote_addr;
}

# Wrap the faucet endpoint with auth_request.
# Replace the existing /api/ proxy_pass for /api/faucet/request.
location = /api/faucet/request {
    auth_request /__captcha_verify;
    auth_request_set $captcha_verified $upstream_http_x_captcha_verified;
    auth_request_set $captcha_secret   $upstream_http_x_captcha_secret;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host                $host;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Captcha-Verified  $captcha_verified;
    proxy_set_header X-Captcha-Secret    $captcha_secret;
    proxy_read_timeout 30;
    limit_req zone=api burst=5 nodelay;
}

# Custom 401/403 from auth_request — return JSON the explorer/UI can show.
error_page 401 403 = @captcha_failed;
location @captcha_failed {
    default_type application/json;
    return 403 '{"ok":false,"error":"captcha verification failed"}';
}
