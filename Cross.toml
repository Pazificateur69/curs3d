[build.env]
passthrough = ["RUSTUP_TOOLCHAIN"]

# Cross's default images ship with stable Rust pre-installed via rustup.
# Our project requires nightly (multiaddr 0.18.2 type-inference issues on
# stable). Install nightly side-by-side and let RUSTUP_TOOLCHAIN=nightly
# (passed through from the host) select it at compile time. Using
# `rustup install nightly` (not `rustup-init`) avoids the rust-std-host
# conflict that `rustup-init --target X` introduces by trying to overwrite
# pre-existing files.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "rustup toolchain install nightly --profile minimal --component rust-std",
    "rustup update nightly",
    "rustup target add --toolchain nightly aarch64-unknown-linux-gnu",
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "rustup toolchain install nightly --profile minimal --component rust-std",
    "rustup update nightly",
    "rustup target add --toolchain nightly x86_64-unknown-linux-gnu",
]
