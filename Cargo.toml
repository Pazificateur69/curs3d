[package]
name = "curs3d"
version = "0.3.5"
edition = "2024"
description = "CURS3D — Quantum-Resistant Blockchain (pre-mainnet testnet, software v0.3.5, consensus protocol v5)"
license = "MIT"
repository = "https://github.com/Pazificateur69/curs3d"

[dependencies]
# Post-quantum cryptography (FIPS-204 ML-DSA-87, pure Rust — same crate as
# `sdk/wasm/curs3d-wallet-wasm`, so signatures produced in the browser wallet
# verify here byte-for-byte).
ml-dsa = { version = "=0.1.0-rc.9", default-features = false, features = [
    "alloc",
    "rand_core",
] }
signature = { version = "3.0.0", default-features = false, features = ["rand_core"] }
sha3 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Persistence (redb replaces sled after soak deadlocks in sled 0.34)
redb = "4.1"

# Wallet encryption
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }

# Networking
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "tokio", "macros"] }
futures = "0.3"

# HTTP API
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.24"

# WASM VM (wasmer 7 — bumped from 5 to fix __rust_probestack linker issue on x86_64)
wasmer = "7"
wasmer-types = "7"

# EVM VM (revm 38 + alloy for RLP-encoded MetaMask txs)
revm = { version = "40", default-features = false, features = [
    "std",
    "optional_balance_check",
    "optional_no_base_fee",
    "optional_block_gas_limit",
    "optional_eip3607",
] }
alloy-consensus = { version = "2", default-features = false, features = ["k256"] }
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-eips = { version = "2", default-features = false }

# Misc
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"

# Bounded LRU cache for the paginated block store (refactor #28).
lru = "0.12"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# secp256k1 signing for eth_sendRawTransaction tests
alloy-signer = "1"
alloy-signer-local = "1"
# Property-based tests (task #33).
proptest = "1.5"

[[bin]]
name = "curs3d"
path = "src/main.rs"

[[bench]]
name = "blockchain_bench"
harness = false
