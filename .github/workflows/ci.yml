name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Provide missing probestack symbol and run tests
        run: |
          echo '.global __rust_probestack; .type __rust_probestack, @function; __rust_probestack: ret' > /tmp/probestack.s
          gcc -c /tmp/probestack.s -o /tmp/probestack.o
          ar rcs /tmp/libprobestack.a /tmp/probestack.o
          RUSTFLAGS="-L /tmp -l static=probestack" cargo test --lib

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # NOTE: --all-targets covers lib + tests + benches + examples.
      # Local pre-commit must run the same: `cargo clippy --all-targets -- -D warnings`.
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  audit:
    name: Cargo Audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        # cargo-audit auto-loads .cargo/audit.toml from the repo root.
        # Documented ignores (transitive deps that don't affect us) live there.
        run: cargo audit

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin curs3d
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curs3d-x86_64-linux
          path: target/release/curs3d
          retention-days: 7

  bench:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks
        run: |
          echo '.global __rust_probestack; .type __rust_probestack, @function; __rust_probestack: ret' > /tmp/probestack.s
          gcc -c /tmp/probestack.s -o /tmp/probestack.o
          ar rcs /tmp/libprobestack.a /tmp/probestack.o
          RUSTFLAGS="-L /tmp -l static=probestack" cargo bench --no-run
